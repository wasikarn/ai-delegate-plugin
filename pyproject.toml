[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-delegate"
version = "0.0.1"
description = "Multi-agent adaptive delegation framework with domain expert debate system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "KoBig"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "agent", "delegation", "multi-agent", "debate"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
ai-delegate = "ai_delegate.cli:main"

[project.urls]
Homepage = "https://github.com/wasikarn/ai-delegate-plugin"
Repository = "https://github.com/wasikarn/ai-delegate-plugin"

[tool.hatch.build.targets.wheel]
packages = ["ai_delegate"]

[tool.hatch.build.targets.sdist]
include = ["ai_delegate", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]